<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Nemesis QR</title>

  <style>

    body {
      margin: 0;
      padding: 30px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #070909;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .qr-page {
      width: 100%;
      max-width: 520px;
      padding: 30px;
      box-sizing: border-box;
      background: #101414;
      border: 1px solid #222;
      border-radius: 18px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .brand {
      color: #39d353;
      font-weight: bold;
      margin-bottom: 25px;
    }

    p {
      line-height: 1.6;
      color: #d8d8d8;
    }

    .status {
      margin-top: 25px;
      color: #39d353;
    }

  </style>

</head>

<body>

  <main class="qr-page">

    <div class="brand">
      NEMESIS QR
    </div>

    <h1>QR Destination</h1>

    <p>
      Loading business information...
    </p>

    <p class="status">
      Please wait.
    </p>

  </main>

</body>

</html>
