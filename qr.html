<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Nemesis QR</title>

  <style>

    body {
      margin: 0;
      padding: 30px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #070909;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .qr-page {
      width: 100%;
      max-width: 520px;
      padding: 30px;
      box-sizing: border-box;
      background: #101414;
      border: 1px solid #222;
      border-radius: 18px;
    }

    .brand {
      color: #39d353;
      font-weight: bold;
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      margin-bottom: 10px;
      text-align: center;
    }

    .category {
      text-align: center;
      color: #39d353;
      font-weight: bold;
    }

    p {
      line-height: 1.6;
      color: #d8d8d8;
    }

    .status {
      text-align: center;
      margin-top: 25px;
      color: #39d353;
    }

.business-actions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 24px;
}

.business-actions a {
  display: block;
  padding: 14px 18px;
  border-radius: 10px;
  background: #176b4d;
  color: #ffffff;
  text-align: center;
  text-decoration: none;
  font-weight: 600;
  font-size: 16px;
}

.business-actions a:hover {
  background: #10523a;
}

.business-actions a[hidden] {
  display: none;
}
  </style>

</head>

<body>

  <main class="qr-page">

    <div class="brand">
      NEMESIS QR
    </div>

    <h1 id="business-name">
      Loading...
    </h1>

    <div
      class="category"
      id="business-category"
    ></div>

    <p id="business-description"></p>


<section id="services-section" hidden>
  <h2>Our Services</h2>
  <div id="services-list"></div>
</section>


<div id="business-actions" class="business-actions">
  <a id="call-button" href="#" hidden>📞 Call Business</a>
  <a id="whatsapp-button" href="#" hidden>💬 WhatsApp</a>
  <a id="directions-button" href="#" hidden>📍 Get Directions</a>
  <a id="website-button" href="#" hidden>🌐 Visit Website</a>
  <a id="email-button" href="#" hidden>✉️ Send Email</a>
</div>
    <p id="business-hours"></p>

    <p
      class="status"
      id="status-message"
    >
      Loading business information...
    </p>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://oioudjbgrtvkbqhwfosw.supabase.co";


    const SUPABASE_ANON_KEY =
      "sb_publishable_eEJjuP4lyJ1AI7peckWdUg_6KvCkv_j";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    async function loadBusiness() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const slug =
        params.get("slug");


      if (!slug) {

        document.getElementById(
          "status-message"
        ).textContent =
          "QR destination not specified.";

        return;

      }


      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "get_public_qr_business",
          {
            p_slug: slug
          }
        );


      if (error) {

        console.error(error);

        document.getElementById(
          "status-message"
        ).textContent =
          "Unable to load this QR destination.";

        return;

      }


      if (
        !data ||
        data.length === 0
      ) {

        document.getElementById(
          "status-message"
        ).textContent =
          "QR destination not found.";

        return;

      }


      const business =
        data[0];

const { data: services, error: servicesError } =
  await supabaseClient.rpc(
    "get_public_qr_services",
    { p_slug: slug }
  );

if (servicesError) {
  console.error("Unable to load services:", servicesError);
} else if (services && services.length > 0) {
  const servicesSection = document.getElementById("services-section");
  const servicesList = document.getElementById("services-list");

  servicesList.replaceChildren();

  services.forEach((service) => {
    const item = document.createElement("div");
    const name = document.createElement("h3");
    const description = document.createElement("p");
    const price = document.createElement("p");

    name.textContent = service.name || "";
    description.textContent = service.description || "";
    price.textContent =
      service.price != null ? "Price: " + service.price : "";

    item.append(name, description, price);

    if (service.image_url) {
      const image = document.createElement("img");
      image.src = service.image_url;
      image.alt = service.name || "Service";
      image.loading = "lazy";
      image.style.maxWidth = "100%";
      item.append(image);
    }

    servicesList.append(item);
  });

  servicesSection.hidden = false;
}

const callButton = document.getElementById("call-button");
const whatsappButton = document.getElementById("whatsapp-button");
const directionsButton = document.getElementById("directions-button");
const websiteButton = document.getElementById("website-button");
const emailButton = document.getElementById("email-button");

if (business.phone) {
  callButton.href = "tel:" + business.phone;
  callButton.hidden = false;
}

if (business.whatsapp) {
  const number = business.whatsapp.replace(/\D/g, "");
  whatsappButton.href = "https://wa.me/" + number;
  whatsappButton.hidden = false;
}

if (business.location_url) {
  directionsButton.href = business.location_url;
  directionsButton.target = "_blank";
  directionsButton.rel = "noopener noreferrer";
  directionsButton.hidden = false;
}

if (business.website_url) {
  websiteButton.href = business.website_url;
  websiteButton.target = "_blank";
  websiteButton.rel = "noopener noreferrer";
  websiteButton.hidden = false;
}

if (business.email) {
  emailButton.href = "mailto:" + business.email;
  emailButton.hidden = false;
    }

      document.getElementById(
        "business-name"
      ).textContent =
        business.customer_name ||
        "Business";


      document.getElementById(
        "business-category"
      ).textContent =
        business.category ||
        "";


      document.getElementById(
        "business-description"
      ).textContent =
        business.description ||
        "";


      document.getElementById(
        "business-hours"
      ).textContent =
        business.opening_hours
          ? "Opening hours: " +
            business.opening_hours
          : "";


      document.getElementById(
        "status-message"
      ).textContent =
        "Nemesis QR destination active.";

    }


    loadBusiness();

  </script>

</body>

</html>
